packages:
  - packages/*
  - __tests__

shellEmulator: true
enablePrePostScripts: true
engineStrict: true
preferWorkspacePackages: true
linkWorkspacePackages: true
strictPeerDependencies: true
autoInstallPeers: false
dedupePeers: true

minimumReleaseAge: 1440

catalog:
  "@cloudflare/workers-types": "^5.20260821.1"
  "@types/node": "^26.2.0"
  "@types/react": "^19.2.18"
  react: "^19.2.8"
  react-dom: "^19.2.8"
  tsdown: "^0.22.14"
  vite: "^8.2.2"
  vitest: "^4.1.11"
  wrangler: "^4.125.0"

allowBuilds:
  es5-ext: true
  esbuild: true
  sharp: true
  workerd: true
