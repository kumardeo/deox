packages:
  - packages/*
  - __tests__

shellEmulator: true
enablePrePostScripts: true
engineStrict: true
preferWorkspacePackages: true
linkWorkspacePackages: true
strictPeerDependencies: true
autoInstallPeers: false
dedupePeers: true

minimumReleaseAge: 1440

catalog:
  "@cloudflare/workers-types": "^5.20261013.1"
  "@types/node": "^26.6.5"
  "@types/react": "^19.3.0"
  react: "^19.3.0"
  react-dom: "^19.3.0"
  tsdown: "^0.23.1"
  vite: "^8.3.4"
  vitest: "^5.0.4"
  wrangler: "^4.150.0"

allowBuilds:
  es5-ext: true
  esbuild: true
  sharp: true
  workerd: true
